name: Manual Deploy to UAT or Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy to'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set target deployment path
        id: set-vars
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "server_path=${{ secrets.PROD_FTP_REMOTE_PATH }}" >> $GITHUB_OUTPUT
            echo "ftp_host=${{ secrets.PROD_FTP_HOST }}" >> $GITHUB_OUTPUT
            echo "ftp_user=${{ secrets.PROD_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "ftp_pass=${{ secrets.PROD_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "server_path=${{ secrets.UAT_FTP_REMOTE_PATH }}" >> $GITHUB_OUTPUT
            echo "ftp_host=${{ secrets.UAT_FTP_HOST }}" >> $GITHUB_OUTPUT
            echo "ftp_user=${{ secrets.UAT_FTP_USERNAME }}" >> $GITHUB_OUTPUT
            echo "ftp_pass=${{ secrets.UAT_FTP_PASSWORD }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to selected environment
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ steps.set-vars.outputs.ftp_host }}
          username: ${{ steps.set-vars.outputs.ftp_user }}
          password: ${{ steps.set-vars.outputs.ftp_pass }}
          server-dir: ${{ steps.set-vars.outputs.server_path }}
          local-dir: ./build  # or ./ for plain PHP
